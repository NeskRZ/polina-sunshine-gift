name: Deploy birthday PWA to GitHub Pages
on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check tested revision is still the latest main commit
        id: freshness
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$TESTED_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment: tested $TESTED_SHA, current main is $latest"
          fi
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Configure Pages
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: steps.freshness.outputs.is_latest == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
